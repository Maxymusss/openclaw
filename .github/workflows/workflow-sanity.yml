        # The 4-vCPU ratchets label can deliver only two usable CPUs.
        concurrency=$((cores / 4))
        if (( concurrency < 1 )); then concurrency=1; fi
        if (( concurrency > 5 )); then concurrency=5; fi
        echo "[corpus:resources] logicalCpuCount=$cores admitted runs=$concurrency"
        pids=()
        labels=()
        result=0
        wait_corpus_batch() {
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error::${labels[$index]} failed"
              result=1
            fi
          done
          pids=()
          labels=()
        }
        for shard in {0..4}; do
          if (( shard == 0 )); then
            run_startup_corpus src/config/config-startup-corpus.test.ts &
            labels+=("config corpus")
