name: Workflow Sanity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-lock-owner-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Actual owner depth-one export and production check shell
        run: python3 scripts/npm-lock-hosted-owner-proof.py
