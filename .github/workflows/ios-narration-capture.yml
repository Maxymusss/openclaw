name: iOS narration before-after capture

on:
  push:
    branches: [roboclaw/ios-narration-proof-156944]
    paths:
      - .github/workflows/ios-narration-capture.yml
      - scripts/test-ios-narration-proof.sh
      - scripts/test-ios-shell-gateway.mjs
      - apps/ios/UITests/OpenClawSnapshotUITests.swift

permissions:
  contents: read

jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CANDIDATE_SHA: 3846b975e5e80656e9a25095649c46fc95cc67a5
      BASELINE_SHA: 8c870f669e3528864881333d04875512ef81cfdc
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3846b975e5e80656e9a25095649c46fc95cc67a5
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout verification-only helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .proof
          persist-credentials: false
      - name: Select repository-native Xcode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain 27.0
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Install pinned native build tools
        run: |
          set -euo pipefail
          scripts/install-xcodegen.sh "$RUNNER_TEMP/ios-tools/bin"
          scripts/install-swift-tools.sh "$RUNNER_TEMP/ios-tools/bin"
          echo "$RUNNER_TEMP/ios-tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          config="$RUNNER_TEMP/ios-simulator.xcconfig"
          printf 'ARCHS = %s\nCOMPILER_INDEX_STORE_ENABLE = NO\n' "$(uname -m)" > "$config"
          echo "XCODE_XCCONFIG_FILE=$config" >> "$GITHUB_ENV"
      - name: Prove baseline failure and repaired iOS interaction
        run: |
          bash .proof/scripts/test-ios-narration-proof.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.proof" \
            "$RUNNER_TEMP/ios-narration-capture" "$BASELINE_SHA" "$CANDIDATE_SHA"
      - name: Upload raw native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-narration-before-after
          path: ${{ runner.temp }}/ios-narration-capture
          if-no-files-found: error
          retention-days: 7
