# Temporary source-bound qualification. Never merge this harness.
name: Temporary integrated FreeBSD remaining qualification

on:
  push:
    branches: [test/freebsd-integrated-package-proof]
    paths: [.github/workflows/freebsd-integrated-native-proof.yml]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: freebsd-integrated-native-proof-155851
  cancel-in-progress: false

env:
  SOURCE_SHA: "892e4e1aca46d6a5ae8ee699fd78aec606054aa3"
  SOURCE_TREE: "7c5bc951d87e603e21ca803cc10abec122cbc987"
  HARNESS_SHA: "82845539c110b395efdd257e5493bea532b44abd"
  PRODUCER_TREE: "23e9edc5e2492d5474d02761a9fd32b4dd651e19"
  CONSUMER_SHA: ${{ github.sha }}
  CONSUMER_PARENT_SHA: "0077fafbe01505d029e51dd98495d149483ec335"
  CONSUMER_PARENT_TREE: "2a2207741df2c836b86d5f2e52efe9e8eef62a0f"
  PRIOR_CONSUMER_SHA: "3f7ed788c310c953a578cd416fcf1838bb520d61"
  PRIOR_CONSUMER_TREE: "c56f1d7fcc10b5e88efa7ee37a32a41c442063c3"
  FIXTURE_RUN_ID: "35784025702"
  FIXTURE_ARTIFACT_ID: "10719246569"
  FIXTURE_ARTIFACT_DIGEST: "sha256:f05e47055a921068fa5b7f51a6fa37552d1cc1acae5f79f56f6a5058c164f8b4"
  FIXTURE_ARTIFACT_SIZE: "164351027"
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  PROOF_REPOSITORY: openclaw/openclaw
  PROOF_RUN_ID: "35781153292"
  PROOF_RUN_ATTEMPT: "1"
  PROOF_JOB_ID: "106926666804"
  PAYLOAD_ARTIFACT_ID: "10717974081"
  PAYLOAD_ARTIFACT_DIGEST: "sha256:4d1f28bc08a4b2598f65a1093b1e926c7afa28813a8ee0e6e21dc01aa4157c04"
  PAYLOAD_ARTIFACT_SIZE: "263497097"
  MANIFEST_SHA: "ea1e9b7332b6947daa587badc48c0c718716035a5c34740f2edc92179cc79671"
  ARCHIVE_SHA: "f950bf5035b1e3e2911743255421d1e9895b8e929c7f0c44a030d7011359f3e7"
  PACKAGE_VERSION: "2026.9.5"
  BASELINE_SRI: sha512-lTQpEEe1Xm3u2PCHaPEr+vP8paGk1vLdHuzdItsNToaLI6hAqRVvgJYg+GxukJhETJp4tPy/S1Gftl4KuB8n7A==
  SOURCE_PINS: '{"package.json":"daeeae9df9b29e09d88c5040f027e1b295f6a2f072887d56b39e525a860ad7ef","pnpm-lock.yaml":"3926f52636eac81ac3f5a282c2bc7b39760ea8350aadee5e681228fed3bcba91","pnpm-workspace.yaml":"12bce91e5e9e4bb52f043f60ce465191f83a2eae0ec9e7be088e5cea2e2454af",".npmrc":"f1d021e2abdf8817d83e35feb1f5d604e8c985aa0553bec3d417cf6f93e9c09c","scripts/freebsd-service-inspect.mjs":"6585523afc1b700b82b53e4b9881944a0f3d58f2dd47c5675252ec658a3a8f4d","scripts/lib/freebsd-service-discovery.mjs":"a18f1ba7022576545571ef033a0060c83343d8a047e380aec15e3dc0543e0d19","scripts/lib/freebsd-service-discovery.d.mts":"efb110b8164077569df27bb8a4ba931180d9438a6ae045cdd03752c26f75ba1f","scripts/install-smoke-candidate-payload.mts":"5f4de9d36236a4f23d769e0972a0f0904864711ff664ba3fad362137dc3902ac","packages/ai/package.json":"b0149f2738759517c06cf550a0ded043ca9fcb54024ba6ec025747b707500ca9","packages/markdown-core/package.json":"eb934f4829a87292edff90480e2c060e636afdd75d35a3ffc02a55581e37a548","packages/model-catalog-core/package.json":"4c53a2d17e2bc41f7011efff70cbd0306122af164c3df8e8e13a4e25c41cec28","packages/normalization-core/package.json":"2bfc2ae79211db8023b168e8dd6c5f378dd64e0890b32ae9a043d38c867683a5","packages/session-url-contract/package.json":"ce05f27abdafc0ff033aadf0d0944f8c48681d5eebcd5dec7485e64215abe827"}'

jobs:
  fixtures:
    # One reviewed successor reuses fixtures and completed Linux/x64 fresh evidence.
    if: github.repository == 'openclaw/openclaw' && github.actor == 'vincentkoc' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '3f7ed788c310c953a578cd416fcf1838bb520d61' && !github.event.forced && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 7
          persist-credentials: false
      - &admit
        name: Bind the remaining cases, successful producer, and terminal prior proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$CONSUMER_PARENT_SHA"
          test "$(git rev-parse "$CONSUMER_PARENT_SHA^{tree}")" = "$CONSUMER_PARENT_TREE"
          test "$(git show -s --format=%P "$CONSUMER_PARENT_SHA")" = 6be1b742e89f53d5385c516c098ef02e0ea42c13
          test "$(git rev-parse 6be1b742e89f53d5385c516c098ef02e0ea42c13^{tree})" = b2929b7004ca257f7cfe230ca20595ab4f69cb2d
          test "$(git show -s --format=%P 6be1b742e89f53d5385c516c098ef02e0ea42c13)" = "$PRIOR_CONSUMER_SHA"
          test "$(git rev-parse "$PRIOR_CONSUMER_SHA^{tree}")" = "$PRIOR_CONSUMER_TREE"
          test "$(git show -s --format=%P "$PRIOR_CONSUMER_SHA")" = "$HARNESS_SHA"
          test "$(git rev-parse "$HARNESS_SHA^{tree}")" = "$PRODUCER_TREE"
          test "$(git show -s --format=%P "$HARNESS_SHA")" = "5a98148a8fa573812cd0a37686518973167e061b $SOURCE_SHA"
          test "$(git show -s --format=%P "$SOURCE_SHA")" = 43f22988f4dcd22644a056591428d5849207593c
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$CONSUMER_PARENT_SHA" HEAD)" = "$(printf '%s\n' .github/workflows/freebsd-integrated-native-proof.yml .github/workflows/freebsd-refreshed-proof.yml)"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = "$(printf '%s\n' .github/workflows/freebsd-integrated-native-proof.yml .github/workflows/freebsd-integrated-package-proof.yml .github/workflows/freebsd-refreshed-proof.yml)"
          test "$(git rev-parse HEAD:.github/workflows/freebsd-integrated-package-proof.yml)" = "$(git rev-parse "$HARNESS_SHA:.github/workflows/freebsd-integrated-package-proof.yml")"
          test -z "$(git status --porcelain)"
          test "$WORKFLOW_SHA" = "$CONSUMER_SHA"
          mkdir -p evidence
          python3 - <<'AUTH'
          import json,os,subprocess,pathlib
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          e=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert e['before']==os.environ['PRIOR_CONSUMER_SHA'] and e['after']==os.environ['CONSUMER_SHA']
          assert not e['forced'] and not e['deleted'] and e['ref']=='refs/heads/test/freebsd-integrated-package-proof'
          repo=os.environ['PROOF_REPOSITORY'];p=api(f'repos/{repo}/pulls/155851')
          assert p['state']=='open' and p['draft'] is True and p['auto_merge'] is None
          assert p['head']['sha']==os.environ['CONSUMER_SHA'] and p['head']['repo']['full_name']==repo
          assert p['head']['ref']=='test/freebsd-integrated-package-proof' and p['user']['login']=='vincentkoc'
          r=api(f"repos/{repo}/actions/runs/{os.environ['PROOF_RUN_ID']}")
          assert r['head_sha']==os.environ['HARNESS_SHA'] and r['run_attempt']==1
          assert r['status']=='completed' and r['conclusion']=='success' and r['event']=='push'
          assert r['path']=='.github/workflows/freebsd-integrated-package-proof.yml'
          j=api(f"repos/{repo}/actions/jobs/{os.environ['PROOF_JOB_ID']}")
          assert j['run_id']==r['id'] and j['head_sha']==r['head_sha'] and j['run_attempt']==1
          assert j['name']=='candidate-package' and j['status']=='completed' and j['conclusion']=='success'
          a=api(f"repos/{repo}/actions/artifacts/{os.environ['PAYLOAD_ARTIFACT_ID']}")
          assert not a['expired'] and a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert a['name']==f"freebsd-integrated-package-{r['id']}-1"
          assert a['size_in_bytes']==int(os.environ['PAYLOAD_ARTIFACT_SIZE']) and a['digest']==os.environ['PAYLOAD_ARTIFACT_DIGEST']
          prior=api(f"repos/{repo}/actions/runs/{os.environ['FIXTURE_RUN_ID']}")
          assert prior['head_sha']==os.environ['PRIOR_CONSUMER_SHA'] and prior['run_attempt']==1
          assert prior['status']=='completed' and prior['conclusion']=='cancelled' and prior['event']=='push'
          assert prior['path']=='.github/workflows/freebsd-integrated-native-proof.yml'
          jobs=api(f"repos/{repo}/actions/runs/{prior['id']}/attempts/1/jobs?per_page=100")
          assert jobs['total_count']==10 and len(jobs['jobs'])==10
          expected={106936290556:('fixtures','success'),106936776534:('linux','success'),
                    106941764241:('native (x86_64, root, fresh)','success'),106941764341:('native (x86_64, ordinary, fresh)','success'),
                    106941764299:('native (x86_64, root, seeded)','failure'),106941764426:('native (x86_64, ordinary, seeded)','failure'),
                    106941764413:('native (aarch64, root, fresh)','cancelled'),106941764257:('native (aarch64, ordinary, fresh)','cancelled'),
                    106941764358:('native (aarch64, root, seeded)','cancelled'),106941764260:('native (aarch64, ordinary, seeded)','cancelled')}
          for job in jobs['jobs']:
              assert job['id'] in expected and (job['name'],job['conclusion'])==expected[job['id']]
              assert job['status']=='completed' and job['head_sha']==prior['head_sha'] and job['run_id']==prior['id'] and job['run_attempt']==1
          required={job_id:name for job_id,(name,result) in expected.items() if result=='success'}
          for job_id,name in required.items():
              matches=[job for job in jobs['jobs'] if job['id']==job_id]
              assert len(matches)==1
              job=matches[0]
              assert job['name']==name and job['head_sha']==prior['head_sha'] and job['run_id']==prior['id'] and job['run_attempt']==1
              assert job['status']=='completed' and job['conclusion']=='success'
          fixture=api(f"repos/{repo}/actions/artifacts/{os.environ['FIXTURE_ARTIFACT_ID']}")
          assert not fixture['expired'] and fixture['workflow_run']['id']==prior['id'] and fixture['workflow_run']['head_sha']==prior['head_sha']
          assert fixture['name']==f"freebsd-integrated-fixtures-{prior['id']}-1"
          assert fixture['size_in_bytes']==int(os.environ['FIXTURE_ARTIFACT_SIZE']) and fixture['digest']==os.environ['FIXTURE_ARTIFACT_DIGEST']
          out=dict(source=os.environ['SOURCE_SHA'],sourceTree=os.environ['SOURCE_TREE'],consumer=os.environ['CONSUMER_SHA'],consumerRun=os.environ['GITHUB_RUN_ID'],consumerAttempt=1,producer=r['head_sha'],producerRun=r['id'],producerJob=j['id'],artifact=a['id'],digest=a['digest'],bytes=a['size_in_bytes'],priorConsumer=prior['head_sha'],priorRun=prior['id'],reusedSuccessfulJobs=required,priorOutcomes=expected,fixtureArtifact=fixture['id'],fixtureDigest=fixture['digest'],fixtureBytes=fixture['size_in_bytes'])
          pathlib.Path('evidence/admission.json').write_text(json.dumps(out)+'\n');print(json.dumps(out))
          AUTH
      - &payload-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: ${{ env.PROOF_RUN_ID }}
          artifact-ids: ${{ env.PAYLOAD_ARTIFACT_ID }}
          digest-mismatch: error
          path: proof-input
          merge-multiple: true
      - &toolchain
        name: Select the recorded Node toolchain without installing workspace dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - &verify-payload
        name: Verify successful seal and exact package/source bytes
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts verify \
            --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA" \
            --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION" \
            --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA" \
            --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA" \
            --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          assert.equal(hash('proof-input/source.tar.gz'),process.env.ARCHIVE_SHA);
          const receipt=JSON.parse(fs.readFileSync('proof-input/complete.json'));
          assert.equal(receipt.source,process.env.SOURCE_SHA);assert.equal(receipt.tree,process.env.SOURCE_TREE);assert.equal(receipt.complete,true);assert.equal(receipt.packageBuildPassed,true);assert.equal(receipt.carrier,process.env.HARNESS_SHA);assert.equal(receipt.run,process.env.PROOF_RUN_ID);assert.equal(receipt.attempt,process.env.PROOF_RUN_ATTEMPT);
          assert.equal(receipt.manifestSha256,process.env.MANIFEST_SHA);assert.equal(receipt.sourceArchiveSha256,process.env.ARCHIVE_SHA);
          assert.equal(receipt.packageVersion,process.env.PACKAGE_VERSION);assert.equal(receipt.fsSafe,'0.18.1');
          console.log(JSON.stringify(receipt));
          VERIFY
      - &fixture-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: ${{ env.FIXTURE_RUN_ID }}
          artifact-ids: ${{ env.FIXTURE_ARTIFACT_ID }}
          digest-mismatch: error
          path: operator-fixtures
          merge-multiple: true
      - &verify-fixtures
        name: Authenticate the complete fixture handoff
        run: |
          set -euo pipefail
          node --input-type=module <<'FIXTURES'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const dir='operator-fixtures',r=JSON.parse(fs.readFileSync(`${dir}/complete.json`));
          assert.equal(r.source,process.env.SOURCE_SHA);assert.equal(r.consumer,process.env.PRIOR_CONSUMER_SHA);assert.equal(r.run,process.env.FIXTURE_RUN_ID);assert.equal(r.attempt,1);
          assert.deepEqual(r.files.map(f=>f.name).sort(),['first-hop.json','first-hop.tgz','published-2026.9.4.tgz','published-pack.original.json']);
          assert.deepEqual(fs.readdirSync(dir).sort(),[...r.files.map(f=>f.name),'complete.json'].sort());
          for(const f of r.files){const stat=fs.lstatSync(`${dir}/${f.name}`);assert(stat.isFile());assert.equal(stat.size,f.bytes);assert.equal(createHash('sha256').update(fs.readFileSync(`${dir}/${f.name}`)).digest('hex'),f.sha256);}
          const baseline=fs.readFileSync(`${dir}/published-2026.9.4.tgz`);assert.equal(`sha512-${createHash('sha512').update(baseline).digest('base64')}`,process.env.BASELINE_SRI);
          const target=JSON.parse(fs.readFileSync(`${dir}/first-hop.json`));assert.equal(target.sourceSha256,createHash('sha256').update(fs.readFileSync('proof-input/payload/candidate.tgz')).digest('hex'));
          console.log(JSON.stringify(r));
          FIXTURES

  native:
    needs: fixtures
    if: ${{ !cancelled() && needs.fixtures.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
        account: [root, ordinary]
        mode: [fresh, seeded]
        exclude:
          - arch: x86_64
            mode: fresh
    env:
      PROOF_ACCOUNT: ${{ matrix.account }}
      PROOF_MODE: ${{ matrix.mode }}
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      CONSUMER_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - *checkout
      - *admit
      - *payload-download
      - *toolchain
      - *verify-payload
      - *fixture-download
      - *verify-fixtures
      - name: Place only authenticated fixtures beside the payload
        run: |
          set -euo pipefail
          for name in first-hop.tgz first-hop.json published-2026.9.4.tgz; do
            test ! -e "proof-input/$name"
            cp "operator-fixtures/$name" "proof-input/$name"
          done
      - name: Stage the ten authenticated guest inputs
        run: |
          set -euo pipefail
          python3 - <<'STAGE'
          import hashlib,json,os,pathlib,shutil,stat,tempfile
          files=['proof-input/source.tar.gz','proof-input/first-hop.tgz','proof-input/first-hop.json','proof-input/published-2026.9.4.tgz',
                 *['proof-input/payload/'+name for name in ['candidate.tgz','candidate-pack.json','install.sh','install-cli.sh','install-smoke-candidate-payload.json']],
                 'scripts/install-smoke-candidate-payload.mts']
          stage=pathlib.Path(tempfile.mkdtemp(prefix='freebsd-native-stage.',dir=os.environ['RUNNER_TEMP']));rows=[]
          for name in sorted(files):
              src=pathlib.Path(name)
              assert stat.S_ISREG(src.lstat().st_mode) and all(not parent.is_symlink() for parent in src.parents)
              dest=stage/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dest)
              data=dest.read_bytes();rows.append(dict(name=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          assert len(rows)==10
          verifier=next(row for row in rows if row['name']=='scripts/install-smoke-candidate-payload.mts')
          assert verifier['sha256']==json.loads(os.environ['SOURCE_PINS'])[verifier['name']]
          receipt=dict(source=os.environ['SOURCE_SHA'],consumer=os.environ['CONSUMER_SHA'],files=rows)
          encoded=json.dumps(receipt,separators=(',',':'))
          pathlib.Path('evidence/native-transfer-inputs.json').write_text(encoded+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('NATIVE_HOST_STAGE='+str(stage)+'\nNATIVE_STAGE_INVENTORY='+encoded+'\n')
          print(json.dumps(dict(stageFiles=len(rows),stageBytes=sum(row['bytes'] for row in rows),inventorySha256=hashlib.sha256(encoded.encode()).hexdigest())))
          STAGE
      - name: Prepare the native VM without copying the runner work directory
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 8192
          sync: "no"
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: NATIVE_STAGE_INVENTORY PROOF_ACCOUNT PROOF_MODE BASELINE_SRI SOURCE_SHA SOURCE_TREE HARNESS_SHA CONSUMER_SHA CONSUMER_RUN_ID CONSUMER_RUN_ATTEMPT SOURCE_PINS EXPECTED_NODE_ARCH MANIFEST_SHA ARCHIVE_SHA PACKAGE_VERSION PAYLOAD_ARTIFACT_ID PAYLOAD_ARTIFACT_DIGEST PROOF_REPOSITORY PROOF_RUN_ID PROOF_RUN_ATTEMPT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 corepack ca_root_nss git-lite gmake python3 bash
      - name: Transfer and verify only the authenticated guest inputs
        env:
          VM_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -d "$NATIVE_HOST_STAGE"
          ssh freebsd 'test ! -e /var/tmp/openclaw-integrated-stage && mkdir -m 0755 /var/tmp/openclaw-integrated-stage'
          rsync_path='sh -c '"'"'PATH=$PATH:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/opt/local/bin:/opt/local/sbin exec rsync "$@"'"'"' rsync'
          transport=(ssh)
          limits=()
          if [ "$VM_ARCH" = aarch64 ]; then
            transport+=(-o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o ConnectTimeout=120)
            limits+=(--timeout 1800)
          fi
          echo 'authenticated guest input transfer starting'
          rsync -rt "${limits[@]}" --rsync-path="$rsync_path" -e "${transport[*]}" "$NATIVE_HOST_STAGE/" freebsd:/var/tmp/openclaw-integrated-stage/
          ssh freebsd 'python3 -' > evidence/native-transfer-guest.json <<'VERIFY_STAGE'
          import hashlib,json,os,pathlib,stat
          root=pathlib.Path('/var/tmp/openclaw-integrated-stage');expected=json.loads(os.environ['NATIVE_STAGE_INVENTORY']);rows=[]
          assert expected['source']==os.environ['SOURCE_SHA'] and expected['consumer']==os.environ['CONSUMER_SHA']
          for p in sorted(root.rglob('*')):
              st=p.lstat()
              if stat.S_ISDIR(st.st_mode): continue
              assert stat.S_ISREG(st.st_mode)
              data=p.read_bytes();rows.append(dict(name=p.relative_to(root).as_posix(),bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          assert len(rows)==10 and rows==expected['files']
          print(json.dumps(dict(source=expected['source'],consumer=expected['consumer'],files=rows,verified=True)))
          VERIFY_STAGE
          cat evidence/native-transfer-guest.json
          echo 'authenticated guest input transfer complete'
      - name: Run native suites and an actual installed update
        shell: freebsd {0}
        run: |
            set -eu
            cd /var/tmp/openclaw-integrated-stage
            umask 022
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { execFileSync } from 'node:child_process';
            const release = execFileSync('/bin/freebsd-version', ['-u'], { encoding: 'utf8' }).trim();
            assert.match(release, /^15\.1-RELEASE(?:-p\d+)?$/);
            assert.equal(process.platform, 'freebsd');
            assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
            assert.equal(process.getuid(), 0); assert.equal(process.geteuid(), 0);
            assert.match(process.version, /^v24\./);
            console.log(JSON.stringify({ release, platform: process.platform, arch: process.arch, node: process.version, uid: process.getuid(), euid: process.geteuid() }));
            NODE
            native_inputs=$(mktemp -d /var/tmp/openclaw-integrated-input.XXXXXX)
            chmod 0755 "$native_inputs"
            cp -R proof-input/. "$native_inputs/"
            cp scripts/install-smoke-candidate-payload.mts "$native_inputs/verifier.mts"
