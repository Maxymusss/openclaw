# Temporary source-bound qualification. Never merge this harness.
name: Temporary integrated FreeBSD package qualification

on:
  push:
    branches: [test/freebsd-integrated-package-proof]
    paths: [.github/workflows/freebsd-integrated-native-proof.yml]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: freebsd-integrated-native-proof-155851
  cancel-in-progress: false

env:
  SOURCE_SHA: "1c0c6449c1efb8e742304385aa2de3597bc15281"
  SOURCE_TREE: "1bec5b9b3940f4eccbb3e56121f9e4f8aafc1a30"
  HARNESS_SHA: "a3ad378d48eab6ca3b0a253b649e92bd5f1b83b9"
  PRODUCER_TREE: "087c60f5954f4c78574ee3c54bd12299a4dae8aa"
  CONSUMER_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  PROOF_REPOSITORY: openclaw/openclaw
  PROOF_RUN_ID: "35755798185"
  PROOF_RUN_ATTEMPT: "1"
  PROOF_JOB_ID: "106841116280"
  PAYLOAD_ARTIFACT_ID: "10708203417"
  PAYLOAD_ARTIFACT_DIGEST: "sha256:68cc13d5b6fb06d34597015bc6108258b688ef882a7c74c655f5768d384335f6"
  PAYLOAD_ARTIFACT_SIZE: "262853698"
  MANIFEST_SHA: "e371d83d1fdd89dbcb834b038620c505eb8e30590e7bf28b7845fb2b92297395"
  ARCHIVE_SHA: "ea95180307575e5c74704a74d152a347ca04cef159053edbb1f3323d5a0fca30"
  PACKAGE_VERSION: "2026.9.5"
  BASELINE_SRI: sha512-lTQpEEe1Xm3u2PCHaPEr+vP8paGk1vLdHuzdItsNToaLI6hAqRVvgJYg+GxukJhETJp4tPy/S1Gftl4KuB8n7A==
  SOURCE_PINS: '{"package.json":"daeeae9df9b29e09d88c5040f027e1b295f6a2f072887d56b39e525a860ad7ef","pnpm-lock.yaml":"3926f52636eac81ac3f5a282c2bc7b39760ea8350aadee5e681228fed3bcba91","pnpm-workspace.yaml":"12bce91e5e9e4bb52f043f60ce465191f83a2eae0ec9e7be088e5cea2e2454af",".npmrc":"f1d021e2abdf8817d83e35feb1f5d604e8c985aa0553bec3d417cf6f93e9c09c","scripts/freebsd-service-inspect.mjs":"6585523afc1b700b82b53e4b9881944a0f3d58f2dd47c5675252ec658a3a8f4d","scripts/lib/freebsd-service-discovery.mjs":"a18f1ba7022576545571ef033a0060c83343d8a047e380aec15e3dc0543e0d19","scripts/lib/freebsd-service-discovery.d.mts":"efb110b8164077569df27bb8a4ba931180d9438a6ae045cdd03752c26f75ba1f","scripts/install-smoke-candidate-payload.mts":"5f4de9d36236a4f23d769e0972a0f0904864711ff664ba3fad362137dc3902ac","packages/ai/package.json":"b0149f2738759517c06cf550a0ded043ca9fcb54024ba6ec025747b707500ca9","packages/markdown-core/package.json":"eb934f4829a87292edff90480e2c060e636afdd75d35a3ffc02a55581e37a548","packages/model-catalog-core/package.json":"4c53a2d17e2bc41f7011efff70cbd0306122af164c3df8e8e13a4e25c41cec28","packages/normalization-core/package.json":"2bfc2ae79211db8023b168e8dd6c5f378dd64e0890b32ae9a043d38c867683a5","packages/session-url-contract/package.json":"ce05f27abdafc0ff033aadf0d0944f8c48681d5eebcd5dec7485e64215abe827"}'

jobs:
  fixtures:
    # Exactly one reviewed successor push consumes the successful producer.
    if: github.repository == 'openclaw/openclaw' && github.actor == 'vincentkoc' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'a3ad378d48eab6ca3b0a253b649e92bd5f1b83b9' && !github.event.forced && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.fixture-upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.fixture-upload.outputs.artifact-digest }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 6
          persist-credentials: false
      - &admit
        name: Bind the single consumer successor and successful sealed producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse "$HARNESS_SHA^{tree}")" = "$PRODUCER_TREE"
          test "$(git show -s --format=%P "$HARNESS_SHA")" = 9c74eab79b2b0227fe1912e135b673d0c5cd9011
          test "$(git show -s --format=%P 9c74eab79b2b0227fe1912e135b673d0c5cd9011)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$HARNESS_SHA" HEAD)" = .github/workflows/freebsd-integrated-native-proof.yml
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = "$(printf '%s\n' .github/workflows/freebsd-integrated-native-proof.yml .github/workflows/freebsd-integrated-package-proof.yml)"
          test -z "$(git status --porcelain)"
          test "$WORKFLOW_SHA" = "$CONSUMER_SHA"
          mkdir -p evidence
          python3 - <<'AUTH'
          import json,os,subprocess,pathlib
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          e=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert e['before']==os.environ['HARNESS_SHA'] and e['after']==os.environ['CONSUMER_SHA']
          assert not e['forced'] and not e['deleted'] and e['ref']=='refs/heads/test/freebsd-integrated-package-proof'
          repo=os.environ['PROOF_REPOSITORY'];p=api(f'repos/{repo}/pulls/155851')
          assert p['state']=='open' and p['draft'] is True and p['auto_merge'] is None
          assert p['head']['sha']==os.environ['CONSUMER_SHA'] and p['head']['repo']['full_name']==repo
          assert p['head']['ref']=='test/freebsd-integrated-package-proof' and p['user']['login']=='vincentkoc'
          r=api(f"repos/{repo}/actions/runs/{os.environ['PROOF_RUN_ID']}")
          assert r['head_sha']==os.environ['HARNESS_SHA'] and r['run_attempt']==1
          assert r['status']=='completed' and r['conclusion']=='success' and r['event']=='push'
          assert r['path']=='.github/workflows/freebsd-integrated-package-proof.yml'
          j=api(f"repos/{repo}/actions/jobs/{os.environ['PROOF_JOB_ID']}")
          assert j['run_id']==r['id'] and j['head_sha']==r['head_sha'] and j['run_attempt']==1
          assert j['name']=='candidate-package' and j['status']=='completed' and j['conclusion']=='success'
          a=api(f"repos/{repo}/actions/artifacts/{os.environ['PAYLOAD_ARTIFACT_ID']}")
          assert not a['expired'] and a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert a['name']==f"freebsd-integrated-package-{r['id']}-1"
          assert a['size_in_bytes']==int(os.environ['PAYLOAD_ARTIFACT_SIZE']) and a['digest']==os.environ['PAYLOAD_ARTIFACT_DIGEST']
          out=dict(source=os.environ['SOURCE_SHA'],sourceTree=os.environ['SOURCE_TREE'],consumer=os.environ['CONSUMER_SHA'],consumerRun=os.environ['GITHUB_RUN_ID'],consumerAttempt=1,producer=r['head_sha'],producerRun=r['id'],producerJob=j['id'],artifact=a['id'],digest=a['digest'],bytes=a['size_in_bytes'])
          pathlib.Path('evidence/admission.json').write_text(json.dumps(out)+'\n');print(json.dumps(out))
          AUTH
      - &payload-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: ${{ env.PROOF_RUN_ID }}
          artifact-ids: ${{ env.PAYLOAD_ARTIFACT_ID }}
          digest-mismatch: error
          path: proof-input
          merge-multiple: true
      - &toolchain
        name: Select the recorded Node toolchain without installing workspace dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - &verify-payload
        name: Verify successful seal and exact package/source bytes
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts verify \
            --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA" \
            --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION" \
            --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA" \
            --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA" \
            --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          assert.equal(hash('proof-input/source.tar.gz'),process.env.ARCHIVE_SHA);
          const receipt=JSON.parse(fs.readFileSync('proof-input/complete.json'));
          assert.equal(receipt.source,process.env.SOURCE_SHA);assert.equal(receipt.tree,process.env.SOURCE_TREE);assert.equal(receipt.complete,true);assert.equal(receipt.packageBuildPassed,true);assert.equal(receipt.carrier,process.env.HARNESS_SHA);assert.equal(receipt.run,process.env.PROOF_RUN_ID);assert.equal(receipt.attempt,process.env.PROOF_RUN_ATTEMPT);
          assert.equal(receipt.manifestSha256,process.env.MANIFEST_SHA);assert.equal(receipt.sourceArchiveSha256,process.env.ARCHIVE_SHA);
          assert.equal(receipt.packageVersion,process.env.PACKAGE_VERSION);assert.equal(receipt.fsSafe,'0.18.1');
          console.log(JSON.stringify(receipt));
          VERIFY
      - name: Derive one metadata-only target and authenticate the exact released driver
        run: |
          set -euo pipefail
          mkdir fixtures
          npm pack openclaw@2026.9.4 --ignore-scripts --json --min-release-age=0 --registry=https://registry.npmjs.org/ --pack-destination fixtures > fixtures/published-pack.original.json
          node --input-type=module <<'BASELINE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const rows=JSON.parse(fs.readFileSync('fixtures/published-pack.original.json'));assert.equal(rows.length,1);
          const r=rows[0];assert.equal(r.name,'openclaw');assert.equal(r.version,'2026.9.4');assert.equal(r.filename,'openclaw-2026.9.4.tgz');assert.equal(r.integrity,process.env.BASELINE_SRI);
          const bytes=fs.readFileSync(`fixtures/${r.filename}`);assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`,process.env.BASELINE_SRI);
          fs.renameSync(`fixtures/${r.filename}`,'fixtures/published-2026.9.4.tgz');
          BASELINE
          node scripts/e2e/lib/update-first-hop-package-fixtures.mjs first-hop-tarball "$PWD/proof-input/payload/candidate.tgz" "$PWD/fixtures/first-hop.tgz" 0 > fixtures/first-hop.json
          node --input-type=module <<'FIXTURE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const r=JSON.parse(fs.readFileSync('fixtures/first-hop.json'));
          assert.equal(r.method,'candidate-same-schema-first-hop-fixture');
          assert(r.members.changes.length>=2);assert(r.members.changes.every(c=>['package.json','dist/build-info.json','dist/postinstall-content-inventory.json'].includes(c.path)&&c.before&&c.after));
          assert.equal(r.sourceSha256,hash('proof-input/payload/candidate.tgz'));assert.equal(r.targetSha256,hash('fixtures/first-hop.tgz'));
          const files=fs.readdirSync('fixtures').sort().map(name=>({name,bytes:fs.statSync(`fixtures/${name}`).size,sha256:hash(`fixtures/${name}`)}));
          fs.writeFileSync('fixtures/complete.json',JSON.stringify({source:process.env.SOURCE_SHA,consumer:process.env.CONSUMER_SHA,run:process.env.GITHUB_RUN_ID,attempt:1,files})+'\n',{flag:'wx'});console.log(JSON.stringify(r));
          FIXTURE
      - id: fixture-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-integrated-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixtures
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *checkout
      - *admit
      - *payload-download
      - *toolchain
      - *verify-payload
      - &fixture-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.fixtures.outputs.artifact-id }}
          digest-mismatch: error
          path: operator-fixtures
          merge-multiple: true
      - &verify-fixtures
        name: Authenticate the complete fixture handoff
        run: |
          set -euo pipefail
          node --input-type=module <<'FIXTURES'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const dir='operator-fixtures',r=JSON.parse(fs.readFileSync(`${dir}/complete.json`));
          assert.equal(r.source,process.env.SOURCE_SHA);assert.equal(r.consumer,process.env.CONSUMER_SHA);assert.equal(r.run,process.env.GITHUB_RUN_ID);assert.equal(r.attempt,1);
          assert.deepEqual(r.files.map(f=>f.name).sort(),['first-hop.json','first-hop.tgz','published-2026.9.4.tgz','published-pack.original.json']);
          assert.deepEqual(fs.readdirSync(dir).sort(),[...r.files.map(f=>f.name),'complete.json'].sort());
          for(const f of r.files){const stat=fs.lstatSync(`${dir}/${f.name}`);assert(stat.isFile());assert.equal(stat.size,f.bytes);assert.equal(createHash('sha256').update(fs.readFileSync(`${dir}/${f.name}`)).digest('hex'),f.sha256);}
          const baseline=fs.readFileSync(`${dir}/published-2026.9.4.tgz`);assert.equal(`sha512-${createHash('sha512').update(baseline).digest('base64')}`,process.env.BASELINE_SRI);
          const target=JSON.parse(fs.readFileSync(`${dir}/first-hop.json`));assert.equal(target.sourceSha256,createHash('sha256').update(fs.readFileSync('proof-input/payload/candidate.tgz')).digest('hex'));
          console.log(JSON.stringify(r));
          FIXTURES
      - name: Run the actual released9.4 updater and candidate second hop
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integrated-linux-source"
          tar -xzf proof-input/source.tar.gz -C "$RUNNER_TEMP/integrated-linux-source"
          export OPENCLAW_QA_ALLOW_UPDATE_FIRST_HOP=1
          export OPENCLAW_UPDATE_FIRST_HOP_SOURCE_PACKAGE_TGZ="$PWD/operator-fixtures/published-2026.9.4.tgz"
          export OPENCLAW_UPDATE_FIRST_HOP_CANDIDATE_PACKAGE_TGZ="$PWD/proof-input/payload/candidate.tgz"
          export OPENCLAW_UPDATE_FIRST_HOP_ARTIFACT_DIR="$PWD/evidence/linux-first-hop"
          bash "$RUNNER_TEMP/integrated-linux-source/openclaw/scripts/e2e/update-first-hop-compat-docker.sh"
          cat "$OPENCLAW_UPDATE_FIRST_HOP_ARTIFACT_DIR/summary.json"
          echo 'Actual published9.4 updater: Linux service-shim proof; missing-restart-chunk negative is not applicable for9.4.'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-integrated-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  native:
    needs: [fixtures, linux]
    if: always() && needs.fixtures.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
        account: [root, ordinary]
        mode: [fresh, seeded]
    env:
      PROOF_ACCOUNT: ${{ matrix.account }}
      PROOF_MODE: ${{ matrix.mode }}
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      CONSUMER_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - *checkout
      - *admit
      - *payload-download
      - *toolchain
      - *verify-payload
      - *fixture-download
      - *verify-fixtures
      - name: Place only authenticated fixtures beside the payload
        run: |
          set -euo pipefail
          for name in first-hop.tgz first-hop.json published-2026.9.4.tgz; do
            test ! -e "proof-input/$name"
            cp "operator-fixtures/$name" "proof-input/$name"
          done
      - name: Run native suites and an actual installed update
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 8192
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: PROOF_ACCOUNT PROOF_MODE BASELINE_SRI SOURCE_SHA SOURCE_TREE HARNESS_SHA CONSUMER_SHA CONSUMER_RUN_ID CONSUMER_RUN_ATTEMPT SOURCE_PINS EXPECTED_NODE_ARCH MANIFEST_SHA ARCHIVE_SHA PACKAGE_VERSION PAYLOAD_ARTIFACT_ID PAYLOAD_ARTIFACT_DIGEST PROOF_REPOSITORY PROOF_RUN_ID PROOF_RUN_ATTEMPT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 corepack ca_root_nss git-lite gmake python3 bash
          run: |
            set -eu
            umask 022
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { execFileSync } from 'node:child_process';
            const release = execFileSync('/bin/freebsd-version', ['-u'], { encoding: 'utf8' }).trim();
            assert.match(release, /^15\.1-RELEASE(?:-p\d+)?$/);
            assert.equal(process.platform, 'freebsd');
            assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
            assert.equal(process.getuid(), 0); assert.equal(process.geteuid(), 0);
            assert.match(process.version, /^v24\./);
            console.log(JSON.stringify({ release, platform: process.platform, arch: process.arch, node: process.version, uid: process.getuid(), euid: process.geteuid() }));
            NODE
            native_inputs=$(mktemp -d /var/tmp/openclaw-integrated-input.XXXXXX)
            chmod 0755 "$native_inputs"
            cp -R proof-input/. "$native_inputs/"
            cp scripts/install-smoke-candidate-payload.mts "$native_inputs/verifier.mts"
            cat > "$native_inputs/verify-source.py" <<'SOURCE_VERIFY'
            import pathlib,os,sys,json,tarfile,hashlib,stat
            root=pathlib.Path(os.environ['SOURCE_ROOT']);rows=[]
            with tarfile.open(pathlib.Path(os.environ['INPUT_ROOT'])/'source.tar.gz','r:gz') as archive:
                for member in archive:
                    parts=pathlib.PurePosixPath(member.name).parts
                    assert parts and parts[0]=='openclaw' and '..' not in parts and not member.name.startswith('/')
                    if member.isdir(): continue
                    relative='/'.join(parts[1:]);assert relative
                    file=root/relative;info=file.lstat()
                    if member.issym():
                        assert stat.S_ISLNK(info.st_mode);expected=member.linkname.encode();actual=os.readlink(file).encode();kind='symlink'
                    else:
                        assert member.isfile() and stat.S_ISREG(info.st_mode);expected=archive.extractfile(member).read();actual=file.read_bytes();kind='executable' if member.mode&0o111 else 'regular'
                        assert bool(info.st_mode&0o111)==bool(member.mode&0o111)
                    assert actual==expected,relative
                    rows.append([relative,kind,hashlib.sha256(actual).hexdigest()])
            rows.sort();identity=dict(source=os.environ['SOURCE_SHA'],tree=os.environ['SOURCE_TREE'],files=len(rows),inventorySha256=hashlib.sha256(json.dumps(rows,separators=(',',':')).encode()).hexdigest())
            dest=pathlib.Path(os.environ['RUN_ROOT'])/f'source-{sys.argv[1]}.json'
            if sys.argv[1]=='after':assert json.loads((dest.parent/'source-before.json').read_text())==identity
            dest.write_text(json.dumps(identity)+'\n');print(json.dumps(identity))
            SOURCE_VERIFY
            export INPUT_ROOT="$native_inputs"
            test ! -e /var/tmp/openclaw-integrated-evidence
            mkdir -m 0700 /var/tmp/openclaw-integrated-evidence
            if [ "$PROOF_ACCOUNT" = ordinary ]; then
              ! pw usershow openclaw-proof >/dev/null 2>&1
              pw useradd -n openclaw-proof -m -s /bin/sh
              test "$(id -u openclaw-proof)" -gt 0
              chown openclaw-proof /var/tmp/openclaw-integrated-evidence
            fi
            cat > "$native_inputs/run-native.sh" <<'NATIVE_SCRIPT'
            set -eu
            umask 022
            cd "$INPUT_ROOT"
            node "$INPUT_ROOT/verifier.mts" verify               --payload-dir "$INPUT_ROOT/payload" --manifest-sha256 "$MANIFEST_SHA"               --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION"               --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA"               --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA"               --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
            proof_root=$(mktemp -d /var/tmp/openclaw-integrated-proof.XXXXXX)
            chmod 0700 "$proof_root"
            export PROOF_ROOT="$proof_root" INPUT_ROOT
            export RUN_ROOT="$proof_root" PROOF_SCRIPT_PID="$$" npm_config_cache="$proof_root/npm-cache"
            collect_native() {
              command_status=$?
              trap - EXIT
              set +e
              export PROOF_COMMAND_STATUS="$command_status"
              python3 - <<'COLLECT'
            import os,pathlib,json,hashlib,tarfile,subprocess,stat
            root=pathlib.Path(os.environ['RUN_ROOT']);dest=pathlib.Path('/var/tmp/openclaw-integrated-evidence')
            selected=[]
            fixed=['initial-discovery.json','source-scope.json','dist-graph.json','source-before.json','source-after.json']
            for name in fixed:
                p=root/name
                if p.exists(): selected.append(p)
            reports=root/'reports'
            if reports.is_dir(): selected.extend(p for p in reports.rglob('*') if p.is_file())
            for cell in [os.environ['PROOF_MODE']]:
                base=root/cell
                for name in ['doctor.log','preview.json','preview.stderr','update.json','update.stderr','handoff-before.json','bootstrap-before.json']:
                    p=base/name
                    if p.exists(): selected.append(p)
                plugins=base/'plugin-evidence'
                if plugins.is_dir(): selected.extend(p for p in plugins.rglob('*') if p.is_file())
            assert len(selected)<=256
            assert sum(p.stat().st_size for p in selected)<=8*1024*1024
            rows=[]
            for p in sorted(selected):
