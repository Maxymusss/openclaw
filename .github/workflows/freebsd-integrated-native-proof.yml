                  assert not r['remainingOwnedDescendants']
                  assert {'source-before.json','source-after.json',*[f'{cell}/{name}' for cell in [os.environ['PROOF_MODE']] for name in ['doctor.log','preview.json','update.json','handoff-before.json']]}<=set(names)
                  assert json.loads(t.extractfile('source-before.json').read())==json.loads(t.extractfile('source-after.json').read())
              for row in r['files']:
                  b=t.extractfile(row['name']).read();assert len(b)==row['bytes'];assert hashlib.sha256(b).hexdigest()==row['sha256']
          print(json.dumps(dict(bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),original=r)))
          CUSTODY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-integrated-${{ matrix.arch }}-${{ matrix.account }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
