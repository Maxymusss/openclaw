          & $openssl cms -encrypt -binary -aes-256-gcm -outform DER -in $zip -out $encrypted -recip (Join-Path $proof 'recipient.pem') -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 > (Join-Path $proof 'encryption.log') 2>&1
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $encrypted -PathType Leaf)) { throw 'Encrypted collection failed; plaintext must not be uploaded' }
          @{kind='encrypted-originals';ciphertextBytes=(Get-Item $encrypted).Length;ciphertextSha256=(Get-FileHash $encrypted -Algorithm SHA256).Hash;plaintextArchiveSha256=(Get-FileHash $zip -Algorithm SHA256).Hash;memberCount=$rows.Count;missingCount=$missing.Count;changingCount=$changing.Count;privateKey='local custodian only';captureComplete=$null} | ConvertTo-Json -Compress
          if ($changing.Count -ne 0 -or $missing.Count -ne 0) { throw 'Missing or changing originals captured as incomplete; no complete-custody claim' }
      - name: Upload encrypted originals only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-native-diagnostic-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/freebsd-ba7632-windows-proof/originals.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
