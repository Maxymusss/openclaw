# Temporary proof carrier. Preserve unmerged until the proof receipt is retained.
name: Updater performance package compatibility
on:
  push:
    branches: [codex/update-performance-secretless-proof-20260923]
    paths: [.github/workflows/update-performance-secretless-proof.yml]
permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
concurrency:
  group: updater-performance-package-qualification
  cancel-in-progress: false
jobs:
  admit:
    if: >-
      github.repository == 'openclaw/openclaw' && github.run_attempt == 1 &&
      github.event_name == 'push' && github.actor == 'steipete' &&
      github.ref == 'refs/heads/codex/update-performance-secretless-proof-20260923' &&
      github.event.created && !github.event.deleted && !github.event.forced &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the sole reviewed workflow change and trusted parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = '0bdab89c2015567b7316b4f5526ff16cb9e5cd80'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/update-performance-secretless-proof.yml'
          test -z "$(git status --porcelain)"
  lease-reader:
    needs: admit
    uses: openclaw/openclaw/.github/workflows/package-acceptance.yml@0bdab89c2015567b7316b4f5526ff16cb9e5cd80
    with:
      workflow_ref: 0bdab89c2015567b7316b4f5526ff16cb9e5cd80
      source: ref
      package_ref: f214d48d9b79f32390bc47a1df378e366727c2be
      suite_profile: custom
      docker_lanes: published-upgrade-survivor
      published_upgrade_survivor_baseline: openclaw@2026.9.5
      published_upgrade_survivor_baselines: openclaw@2026.9.5
      published_upgrade_survivor_scenarios: base
      telegram_mode: none
      shared_image_policy: no-push-artifact
      shared_image_artifact_namespace: update-perf-156757
      advisory: false
    # Intentionally omit secrets and secrets: inherit.
